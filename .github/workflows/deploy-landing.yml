name: Deploy Landing Page

on:
  push:
    branches: [master]
    paths:
      - 'landing/**'
      - 'public/auth-redirect.html'
      - '.github/workflows/deploy-landing.yml'

jobs:
  deploy:
    name: Deploy to Tencent Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH key and known hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TC_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TC_SERVER_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "TC_SERVER_SSH_KEY is not configured" >&2
            exit 1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "TC_SERVER_KNOWN_HOSTS is not configured" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -P "" -f ~/.ssh/deploy_key > /dev/null
          if ! ssh-keygen -F 43.139.44.156 -f ~/.ssh/known_hosts > /dev/null; then
            echo "TC_SERVER_KNOWN_HOSTS has no entry for 43.139.44.156" >&2
            exit 1
          fi

      - name: Deploy landing page via rsync over SSH
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            landing/ \
            root@43.139.44.156:/var/www/video-tracker/

      - name: Deploy auth-redirect.html
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            public/auth-redirect.html \
            root@43.139.44.156:/var/www/video-tracker/

      - name: Set permissions
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            root@43.139.44.156 \
            "chown -R www-data:www-data /var/www/video-tracker/ && find /var/www/video-tracker/ -type d -exec chmod 755 {} \; && find /var/www/video-tracker/ -type f -exec chmod 644 {} \;"
