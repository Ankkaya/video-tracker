<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Tracker - 认证完成</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { font-size: 20px; margin-bottom: 12px; }
    p { font-size: 14px; color: #666; line-height: 1.6; }
    .tip {
      margin-top: 20px;
      padding: 12px 16px;
      background: #f0f4ff;
      border-radius: 8px;
      font-size: 13px;
      color: #4361ee;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h2>认证成功</h2>
    <p>请打开 Video Tracker 扩展，登录将自动完成。</p>
    <div class="tip">如果扩展未自动登录，请刷新扩展页面。</div>
  </div>
</body>
</html>
