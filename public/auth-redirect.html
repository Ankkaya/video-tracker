<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Tracker - 登录跳转</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 20px; margin-bottom: 12px; }
    p { font-size: 14px; color: #666; line-height: 1.6; }
    .error { color: #e53e3e; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #5a6fd6; }
  </style>
</head>
<body>
  <div class="card" id="loading">
    <div class="spinner"></div>
    <h2>正在跳转…</h2>
    <p>正在打开 Video Tracker 扩展</p>
  </div>

  <div class="card" id="error" style="display:none">
    <h2 class="error">跳转失败</h2>
    <p id="error-msg"></p>
    <p style="margin-top: 12px;">请确保已在 Chrome 中安装 Video Tracker 扩展，然后点击下方按钮重试。</p>
    <button class="btn" id="retry-btn">重试跳转</button>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));

      // 从 URL 参数中提取 token（可能在 search 或 hash 中）
      var accessToken = hashParams.get('access_token') || params.get('access_token');
      var refreshToken = hashParams.get('refresh_token') || params.get('refresh_token');
      var extId = params.get('ext_id');
      var type = hashParams.get('type') || params.get('type');

      // 清理 URL，移除敏感参数
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }

      function showError(msg) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error-msg').textContent = msg || '无法打开扩展页面。';
      }

      if (!extId) {
        showError('缺少扩展 ID 参数，无法完成跳转。');
        return;
      }

      // 拼接扩展页面 URL
      var extUrl = 'chrome-extension://' + extId + '/options.html';
      var hashParts = [];
      if (accessToken) hashParts.push('access_token=' + encodeURIComponent(accessToken));
      if (refreshToken) hashParts.push('refresh_token=' + encodeURIComponent(refreshToken));
      if (type) hashParts.push('type=' + encodeURIComponent(type));

      // 保留其他可能的参数
      hashParams.forEach(function (value, key) {
        if (key !== 'access_token' && key !== 'refresh_token' && key !== 'type') {
          hashParts.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
        }
      });

      if (hashParts.length > 0) {
        extUrl += '#' + hashParts.join('&');
      }

      // 尝试跳转
      try {
        window.location.href = extUrl;
        // 如果跳转失败（chrome-extension 协议被拦截），2秒后显示错误
        setTimeout(function () {
          showError('浏览器阻止了自动跳转。请复制以下地址并在地址栏中打开：\n' + extUrl);
        }, 2000);
      } catch (e) {
        showError('跳转出错：' + e.message);
      }

      // 重试按钮
      document.getElementById('retry-btn').addEventListener('click', function () {
        window.location.href = extUrl;
      });
    })();
  </script>
</body>
</html>
