<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Tracker - 认证结果</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f7;
      overflow: hidden;
    }

    /* 浮动光晕 */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 {
      width: 300px; height: 300px;
      background: #c7d2fe;
      top: 15%; left: 10%;
    }
    .orb-2 {
      width: 250px; height: 250px;
      background: #ddd6fe;
      bottom: 15%; right: 10%;
      animation-delay: -3s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
    }
    .icon-success { background: #f0fdf4; }
    .icon-error { background: #fef2f2; }
    .icon-warn { background: #fffbeb; }

    h2 {
      font-size: 20px;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .badge-success { background: #f0fdf4; color: #16a34a; }
    .badge-error { background: #fef2f2; color: #dc2626; }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="card" id="content"></div>

  <script>
    // 粒子动画
    (function () {
      var canvas = document.getElementById('particles');
      var ctx = canvas.getContext('2d');
      var particles = [];
      var count = 80;
      var mouse = { x: -999, y: -999 };
      var repulseRadius = 120;
      var repulseForce = 8;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      document.addEventListener('mousemove', function (e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      document.addEventListener('mouseleave', function () {
        mouse.x = -999;
        mouse.y = -999;
      });

      function create() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2.5 + 1,
          dx: (Math.random() - 0.5) * 0.3,
          dy: (Math.random() - 0.5) * 0.3,
          vx: 0,
          vy: 0,
          o: Math.random() * 0.3 + 0.1,
        };
      }
      for (var i = 0; i < count; i++) particles.push(create());

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];

          // 鼠标排斥力
          var dx = p.x - mouse.x;
          var dy = p.y - mouse.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < repulseRadius && dist > 0) {
            var force = (repulseRadius - dist) / repulseRadius * repulseForce;
            p.vx += (dx / dist) * force;
            p.vy += (dy / dist) * force;
          }

          // 速度衰减
          p.vx *= 0.92;
          p.vy *= 0.92;

          p.x += p.dx + p.vx;
          p.y += p.dy + p.vy;

          // 边界反弹
          if (p.x < 0) { p.x = 0; p.dx *= -1; p.vx *= -0.5; }
          if (p.x > canvas.width) { p.x = canvas.width; p.dx *= -1; p.vx *= -0.5; }
          if (p.y < 0) { p.y = 0; p.dy *= -1; p.vy *= -0.5; }
          if (p.y > canvas.height) { p.y = canvas.height; p.dy *= -1; p.vy *= -0.5; }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(99, 102, 241, ' + p.o + ')';
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

  <script>
    (function () {
      var hash = window.location.hash.replace(/^#/, '');
      var params = new URLSearchParams(hash);
      var accessToken = params.get('access_token');
      var error = params.get('error');
      var errorDesc = (params.get('error_description') || '').replace(/\+/g, ' ');

      var content = document.getElementById('content');

      if (accessToken) {
        content.innerHTML =
          '<div class="icon icon-success">✅</div>' +
          '<h2>认证成功</h2>' +
          '<p>正在跳转到 Video Tracker 扩展...</p>' +
          '<div class="spinner"></div>' +
          '<div class="badge badge-success">页面将自动跳转</div>';
      } else if (error) {
        content.innerHTML =
          '<div class="icon icon-error">❌</div>' +
          '<h2>认证失败</h2>' +
          '<p>' + errorDesc + '</p>' +
          '<div class="badge badge-error">请返回扩展重新操作</div>';
      } else {
        content.innerHTML =
          '<div class="icon icon-warn">⚠️</div>' +
          '<h2>无效的认证链接</h2>' +
          '<p>请从邮件中点击链接，或返回扩展重新操作。</p>';
      }
    })();
  </script>
</body>
</html>
