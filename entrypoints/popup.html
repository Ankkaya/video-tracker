<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><link rel="icon" type="image/png" href="/icon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoTracker</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Paint the popup canvas too, including fractional pixels at its edges. */
      html {
        background: #f8f9fa;
        color-scheme: light;
      }
      html.dark {
        background: #1a1a2e;
        color-scheme: dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 380px;
        min-height: 200px;
        max-height: 600px;
        overflow-y: auto;
        background: inherit;
        color: #1a1a2e;
      }
      html.dark body { color: #e0e0e0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../src/popup/main.ts"></script>
  </body>
</html>
